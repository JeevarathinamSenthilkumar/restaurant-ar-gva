<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Restaurant AR Menu</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Model Viewer -->
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>

  <!-- Custom CSS -->
  <link rel="stylesheet" href="style.css" />
</head>
<body class="bg-gradient-to-br from-gray-100 to-gray-200 min-h-screen flex flex-col items-center p-4">

  <!-- Header -->
  <header class="w-full flex items-center justify-between mb-4">
    <div class="flex items-center space-x-2">
      <img src="https://github.com/JeevarathinamSenthilkumar/restaurant-ar-gva/blob/main/Logo.png" alt="Logo" class="rounded-full border border-gray-300">
      <h1 class="text-lg font-semibold">Restaurant AR</h1>
    </div>
  </header>

  <!-- Search bar -->
  <div class="w-full relative mb-4">
    <input
      id="searchInput"
      type="text"
      placeholder="Search dishes..."
      class="w-full rounded-full border border-gray-300 pl-10 pr-4 py-2 focus:outline-none focus:ring focus:ring-green-300"
    />
    <svg class="w-5 h-5 absolute left-3 top-2.5 text-gray-400" xmlns="http://www.w3.org/2000/svg" fill="none"
      viewBox="0 0 24 24" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
        d="M21 21l-4.35-4.35m0 0A7.5 7.5 0 1116.65 16.65z" />
    </svg>
  </div>

  <!-- Filter buttons -->
  <div class="flex space-x-2 mb-6 overflow-x-auto w-full justify-start">
    <button class="filter-btn active" data-category="all">All</button>
    <button class="filter-btn" data-category="starters">Starters</button>
    <button class="filter-btn" data-category="main">Main Course</button>
    <button class="filter-btn" data-category="dessert">Dessert</button>
  </div>

  <!-- Menu Grid -->
  <div id="menuGrid" class="grid grid-cols-1 sm:grid-cols-2 gap-4 w-full max-w-md">

    <!-- Card 1 -->
    <div class="menu-card" data-category="dessert" data-name="La Mucca Ballerina">
      <model-viewer src="https://modelviewer.dev/shared-assets/models/Astronaut.glb" alt="3D Dish" auto-rotate camera-controls></model-viewer>
      <div class="p-3">
          <h2 class="font-semibold text-lg mb-1">La Mucca Ballerina</h2>
          <p class="text-sm text-gray-600 mb-3">Flaky custard layered with almond cream, fresh berries, and a dusting of powdered sugar.</p>
          <div class="flex justify-between items-center mt-2">
              <div class="flex flex-col items-center">
                  <span class="text-orange-500 text-lg font-bold">★</span>
                  <span class="text-orange-500 font-semibold text-sm">4.8</span>
              </div>
              <button class="view-btn" onclick="openARLink()">
                  <img src="https://github.com/JeevarathinamSenthilkumar/restaurant-ar-gva/blob/main/ARIcon.png" alt="AR icon" class="ar-icon">
                  <span>View on your table</span>
              </button>
          </div>
      </div>
    </div>

    <!-- Card 2 -->
    <div class="menu-card" data-category="main" data-name="Salmon Tartine">
      <model-viewer src="https://modelviewer.dev/shared-assets/models/RobotExpressive.glb" alt="3D Dish" auto-rotate camera-controls></model-viewer>
      <div class="p-3">
          <h2 class="font-semibold text-lg mb-1">Salmon Tartine</h2>
          <p class="text-sm text-gray-600 mb-3">Grilled sourdough topped with smoked salmon, cream cheese, and dill.</p>
          <div class="flex justify-between items-center mt-2">
              <div class="flex flex-col items-center">
                  <span class="text-orange-500 text-lg font-bold">★</span>
                  <span class="text-orange-500 font-semibold text-sm">4.8</span>
              </div>
              <button class="view-btn" onclick="openARLink()">
                  <img src="https://github.com/JeevarathinamSenthilkumar/restaurant-ar-gva/blob/main/ARIcon.png" alt="AR icon" class="ar-icon">
                  <span>View on your table</span>
              </button>
          </div>

      </div>
    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
