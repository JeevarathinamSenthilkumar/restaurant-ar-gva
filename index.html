<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Restaurant AR Menu</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Google Model Viewer -->
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>

  <!-- Custom CSS -->
  <link rel="stylesheet" href="style.css" />
</head>

<body class="bg-gradient-to-br from-gray-100 to-gray-200 min-h-screen flex flex-col items-center p-4">

  <!-- Header -->
  <header class="w-full flex items-center justify-between mb-4">
    <div class="flex items-center space-x-2">
      <img src="images/Logo.png" alt="Logo" class="h-12 w-12 object-contain">
      <h1 class="text-lg font-semibold text-gray-800">Restaurant AR</h1>
    </div>
  </header>

  <!-- Search Bar -->
  <div class="w-full relative mb-6">
    <img 
      src="images/search.svg" 
      alt="Search icon" 
      class="absolute left-4 top-1/2 -translate-y-1/2 w-7 h-7 pointer-events-none opacity-90"
    />
    <input
      id="searchInput"
      type="text"
      placeholder="Search dishes..."
      class="w-full rounded-full border border-gray-300 pl-14 pr-4 py-3 text-gray-700 placeholder-gray-400 
             focus:outline-none focus:ring-2 focus:ring-blue-300 focus:border-blue-300 shadow-sm bg-white/70 backdrop-blur"
    />
  </div>

  <!-- Filter Buttons -->
  <div class="flex space-x-2 mb-8 overflow-x-auto w-full justify-center">
    <button class="filter-btn active" data-category="all">All</button>
    <button class="filter-btn" data-category="starters">Starters</button>
    <button class="filter-btn" data-category="main">Main Course</button>
    <button class="filter-btn" data-category="dessert">Dessert</button>
  </div>

  <!-- Menu Grid -->
  <div class="w-full flex justify-center">
    <div id="menuGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6 w-full max-w-6xl">

      <!-- 🍕 Pizza -->
      <div class="menu-card" data-category="main" data-name="pizza">
        <model-viewer 
          id="pizzaModel"
          src="android-3d-models/pizza.glb"
          ios-src="ios-3d-models/pizza.usdz"
          alt="Pizza 3D model"
          auto-rotate
          camera-controls
          ar
          ar-modes="webxr scene-viewer quick-look"
          ar-scale="fixed"
          class="w-full h-64 rounded-2xl bg-gray-50 my-2">
        </model-viewer>

        <div class="flex justify-between items-center mt-2">
          <div>
            <h2 class="text-lg font-semibold text-gray-800">Pizza Margherita</h2>
            <p class="text-sm text-gray-500">Classic cheese & tomato</p>
          </div>
          <span class="text-lg font-semibold text-gray-800">$12</span>
        </div>

        <div class="flex justify-between items-center mt-3">
          <div class="flex items-center space-x-1">
            <span class="text-yellow-500 text-lg">★</span>
            <span class="text-gray-700 font-medium">4.8</span>
          </div>
          <button 
            onclick="activateAR('pizzaModel')"
            class="view-btn">
            <img src="images/ARIcon.png" alt="AR icon" class="ar-icon">
            View on your table
          </button>
        </div>
      </div>

      <!-- 🍝 Pasta -->
      <div class="menu-card" data-category="main" data-name="pasta">
        <model-viewer 
          id="pastaModel"
          src="android-3d-models/pasta.glb"
          ios-src="ios-3d-models/pasta.usdz"
          alt="Pasta 3D model"
          auto-rotate
          camera-controls
          ar
          ar-modes="webxr scene-viewer quick-look"
          ar-scale="fixed"
          class="w-full h-64 rounded-2xl bg-gray-50 my-2">
        </model-viewer>

        <div class="flex justify-between items-center mt-2">
          <div>
            <h2 class="text-lg font-semibold text-gray-800">Pasta Alfredo</h2>
            <p class="text-sm text-gray-500">Creamy Italian delight</p>
          </div>
          <span class="text-lg font-semibold text-gray-800">$14</span>
        </div>

        <div class="flex justify-between items-center mt-3">
          <div class="flex items-center space-x-1">
            <span class="text-yellow-500 text-lg">★</span>
            <span class="text-gray-700 font-medium">4.9</span>
          </div>
          <button 
            onclick="activateAR('pastaModel')"
            class="view-btn">
            <img src="images/ARIcon.png" alt="AR icon" class="ar-icon">
            View on your table
          </button>
        </div>
      </div>

      <!-- 🍰 Dessert -->
      <div class="menu-card" data-category="dessert" data-name="tiramisu">
        <model-viewer 
          id="dessertModel"
          src="android-3d-models/dessert.glb"
          ios-src="ios-3d-models/dessert.usdz"
          alt="Tiramisu 3D model"
          auto-rotate
          camera-controls
          ar
          ar-modes="webxr scene-viewer quick-look"
          ar-scale="fixed"
          class="w-full h-64 rounded-2xl bg-gray-50 my-2">
        </model-viewer>

        <div class="flex justify-between items-center mt-2">
          <div>
            <h2 class="text-lg font-semibold text-gray-800">Tiramisu</h2>
            <p class="text-sm text-gray-500">Coffee-flavored Italian dessert</p>
          </div>
          <span class="text-lg font-semibold text-gray-800">$9</span>
        </div>

        <div class="flex justify-between items-center mt-3">
          <div class="flex items-center space-x-1">
            <span class="text-yellow-500 text-lg">★</span>
            <span class="text-gray-700 font-medium">4.7</span>
          </div>
          <button 
            onclick="activateAR('dessertModel')"
            class="view-btn">
            <img src="images/ARIcon.png" alt="AR icon" class="ar-icon">
            View on your table
          </button>
        </div>
      </div>

    </div>
  </div>

  <!-- JS -->
  <script src="script.js"></script>
</body>
</html>
